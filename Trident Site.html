a-hidden=\"true\"><span><\u002Fspan><em>the gap<\u002Fem><span><\u002Fspan><\u002Fdiv>\n    <div class=\"gap-side\"><div class=\"v neg\">3 %<\u002Fdiv><div class=\"k\">of SMEs fully support it today<\u002Fdiv><\u002Fdiv>\n    <div class=\"gap-src\">localsearch × HSLU, KMU Digital Pulse 2025<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stats4\">\n    <div class=\"stat rv\"><div class=\"v\">21×<\u002Fdiv><div class=\"k\">lower odds of qualifying a lead after 30 minutes vs 5 minutes<\u002Fdiv><div class=\"src\">US study, 2007<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat rv\"><div class=\"v\">3 channels<\u002Fdiv><div class=\"k\">used almost equally. No single one to staff<\u002Fdiv>\n      <div class=\"chbars\"><div><span>E-mail<\u002Fspan><i style=\"--w:100%\"><\u002Fi><b>16 %<\u002Fb><\u002Fdiv><div><span>Chat<\u002Fspan><i style=\"--w:100%\"><\u002Fi><b>16 %<\u002Fb><\u002Fdiv><div><span>Phone<\u002Fspan><i style=\"--w:87.5%\"><\u002Fi><b>14 %<\u002Fb><\u002Fdiv><\u002Fdiv>\n      <div class=\"src\">ServiceNow, 2024<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat rv\"><div class=\"v\">85 %<\u002Fdiv><div class=\"k\">of the population use WhatsApp. The channel exists; the staffing doesn't<\u002Fdiv><div class=\"src\">Switzerland<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat rv\"><div class=\"v\">13 %<\u002Fdiv><div class=\"k\">start looking for a service in an AI assistant, not a search engine<\u002Fdiv><div class=\"src\">KMU Digital Pulse, 2025<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- SERVICES -->\n<section class=\"sec\" id=\"services\" data-screen-label=\"Services\"><div class=\"wrap\">\n  <div class=\"sec-head-row\"><div class=\"t\">\n    <span class=\"label\">What we do<\u002Fspan>\n    <h2 class=\"h2\">Five lines of work, one accountable team<\u002Fh2>\n  <\u002Fdiv><a href=\"#contact\" class=\"btn btn-outline\">Discuss a project <span class=\"ar\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n  <div class=\"cards\">\n    <a class=\"card wide rv\" href=\"#agent\"><div class=\"shot\"><image-slot id=\"svc-ai\" shape=\"rect\" placeholder=\"AI agent conversation / document pipeline visual\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"card-b\"><h3 class=\"h3\">AI agents &amp; LLM automation<\u002Fh3><p class=\"body-s\">Enquiry handling, document processing, recommendations, search over company knowledge. Agents wired into your real systems, not chat widgets.<\u002Fp><span class=\"link\">How it works <span class=\"ar\">→<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fa>\n    <a class=\"card rv\" href=\"#products\"><div class=\"shot\"><image-slot id=\"svc-log\" shape=\"rect\" placeholder=\"Logistics platform screen\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"card-b\"><h3 class=\"h3\">Logistics &amp; operations platforms<\u002Fh3><p class=\"body-s\">Order intake, dispatch, driver apps, tracking, automated billing.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"card rv\" href=\"#products\"><div class=\"shot\"><image-slot id=\"svc-iot\" shape=\"rect\" placeholder=\"IoT device photo\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"card-b\"><h3 class=\"h3\">IoT &amp; connected products<\u002Fh3><p class=\"body-s\">Firmware, cloud platform, rules engines, dealer and consumer apps.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"card rv\" href=\"#contact\"><div class=\"shot\"><image-slot id=\"svc-custom\" shape=\"rect\" placeholder=\"B2B portal screen\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"card-b\"><h3 class=\"h3\">Custom business systems<\u002Fh3><p class=\"body-s\">B2B portals, ERP and accounting integrations, legacy migrations.<\u002Fp><\u002Fdiv><\u002Fa>\n    <a class=\"card rv\" href=\"#contact\"><div class=\"shot\"><image-slot id=\"svc-cto\" shape=\"rect\" placeholder=\"Team / workshop photo\"><\u002Fimage-slot><\u002Fdiv>\n      <div class=\"card-b\"><h3 class=\"h3\">CTO as a Service<\u002Fh3><p class=\"body-s\">Fractional or interim technical leadership when you've outgrown your first developers.<\u002Fp><\u002Fdiv><\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- AGENT FEATURES -->\n<section class=\"sec alt\" id=\"agent\" data-screen-label=\"Agent\"><div class=\"wrap\">\n  <div class=\"sec-head\">\n    <span class=\"label\">The AI agent<\u002Fspan>\n    <h2 class=\"h2\">A working process with a language model inside it<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"feats\">\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <h3 class=\"h3\">Answers and qualifies, at any hour<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">Every channel, weekends and cantonal holidays included. Asks the questions your best rep asks, in the buyer's language.<\u002Fp>\n      <ul><li><b>Seconds<\u002Fb> to first response, on e-mail, chat, phone and WhatsApp<\u002Fli><li><b>Four language regions<\u002Fb> from day one<\u002Fli><li>Answers recorded as <b>structured fields<\u002Fb><\u002Fli><\u002Ful>\n    <\u002Fdiv><div class=\"chat\" id=\"chat\" aria-label=\"Example conversation\">\n      <div class=\"chat-hd\"><span class=\"av\"><img src=\"a92ebcaf-01de-4793-a1e7-8b1f47c1393c\" alt=\"\"><\u002Fspan><div><b>Agent · Matériaux Valais<\u002Fb><small>WhatsApp<\u002Fsmall><\u002Fdiv><span class=\"live\">Online · Sa 21:47<\u002Fspan><\u002Fdiv>\n      <div class=\"bub in\">Bonsoir, vous livrez du gravier 0/16 à Sierre lundi&nbsp;? 8 tonnes.<span class=\"meta\">FR · 21:47<\u002Fspan><\u002Fdiv>\n      <div class=\"bub out\">Bonsoir&nbsp;! Oui, 8 t de gravier 0/16 sont en stock. Lundi, je peux proposer 7h30 ou 13h00 à Sierre.<span class=\"meta\">Agent · 4 s<\u002Fspan><\u002Fdiv>\n      <div class=\"bub in\">7h30 parfait.<span class=\"meta\">FR · 21:48<\u002Fspan><\u002Fdiv>\n      <div class=\"slotcard\"><b>Livraison confirmée<\u002Fb><span class=\"ok\">QR-bill sent<\u002Fspan><span>Lun. 7h30 · Sierre · 8 t<\u002Fspan><\u002Fdiv>\n      <div class=\"bub out\">C'est réservé. La facture QR et le suivi du camion arrivent par e-mail.<span class=\"meta\">Agent · 3 s · CRM updated<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <h3 class=\"h3\">Recommends and closes the small stuff<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">Works from your live catalogue, stock and price list. Handles standard objections with your approved wording.<\u002Fp>\n      <ul><li>Books appointments against a <b>real calendar<\u002Fb><\u002Fli><li>Issues <b>QR-bills<\u002Fb> and payment links<\u002Fli><li>Escalates to a person on <b>defined conditions<\u002Fb><\u002Fli><\u002Ful>\n    <\u002Fdiv><div class=\"shot\"><image-slot id=\"feat-2\" shape=\"rect\" placeholder=\"Booking / QR-bill screenshot\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <h3 class=\"h3\">Writes into your systems<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">Contact, company, deal and full transcript go into your CRM, so the next person starts from a complete record.<\u002Fp>\n      <ul><li>CRM and ERP integration<\u002Fli><li>Audit trail on every dialogue<\u002Fli><li>Escalation path designed <b>before launch<\u002Fb><\u002Fli><\u002Ful>\n    <\u002Fdiv><div class=\"shot\"><image-slot id=\"feat-3\" shape=\"rect\" placeholder=\"CRM record screenshot\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- USE CASES -->\n<section class=\"sec\" id=\"usecases\" data-screen-label=\"Use cases\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Use cases<\u002Fspan><h2 class=\"h2\">Eight patterns where an agent pays for itself<\u002Fh2><p class=\"lede\">Each comes with a precondition. Most failed AI projects fail there, not in the model.<\u002Fp><\u002Fdiv>\n  <div class=\"ucs\"><div class=\"uc rv\"><span class=\"n\">01<\u002Fspan><h3 class=\"h4\">Inbound enquiry handling<\u002Fh3><p class=\"body-s\">Answers in seconds on every channel, qualifies, books, writes into the CRM. Replaces the queue, not a person.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Answers exist in writing: price list, catalogue, terms.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">02<\u002Fspan><h3 class=\"h4\">Document processing<\u002Fh3><p class=\"body-s\">Reads invoices, delivery notes and forms, matches them to records, flags mismatches, writes structured data.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> A clear definition of which field goes where.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">03<\u002Fspan><h3 class=\"h4\">Order intake from messages<\u002Fh3><p class=\"body-s\">Turns \"the usual pallet\" on WhatsApp into a draft order the customer confirms in one message.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Customer order history in a system.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">04<\u002Fspan><h3 class=\"h4\">Dispatcher assistant<\u002Fh3><p class=\"body-s\">Proposes assignment and sequence, explains why, recalculates on change. The dispatcher decides.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Built as advice, never silent overrule.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">05<\u002Fspan><h3 class=\"h4\">Search over company knowledge<\u002Fh3><p class=\"body-s\">Answers from contracts, manuals and policies with citations. Says \"not found\" instead of inventing.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Document hygiene: no three contradictory versions.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">06<\u002Fspan><h3 class=\"h4\">Recommendation<\u002Fh3><p class=\"body-s\">Proposes the next offer from live stock, margin and history, with the reason attached.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Transaction history and live stock data.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">07<\u002Fspan><h3 class=\"h4\">Status and self-service<\u002Fh3><p class=\"body-s\">\"Where is my delivery?\" answered from live data. Resends invoices, reschedules.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Operational system with readable status.<\u002Fp><\u002Fdiv><div class=\"uc rv\"><span class=\"n\">08<\u002Fspan><h3 class=\"h4\">Back-office triage<\u002Fh3><p class=\"body-s\">Sorts, summarises and routes incoming work to the right person or system.<\u002Fp><p class=\"pre\"><b>Needs:<\u002Fb> Agreed routing rules.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- CASES -->\n<section class=\"sec alt\" id=\"cases\" data-screen-label=\"Cases\"><div class=\"wrap\">\n  <div class=\"sec-head\">\n    <span class=\"label\">Results<\u002Fspan>\n    <h2 class=\"h2\">Delivered, then counted<\u002Fh2>\n    <p class=\"lede\">Each case is labelled: <b>measured<\u002Fb> means counted in production; <b>modelled<\u002Fb> means calculated from real volumes.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"cases-v2\">\n    <article class=\"cs cs-lead rv\"><div class=\"shot\"><image-slot id=\"case-clinic\" shape=\"rect\" placeholder=\"Clinic admission visual\"><\u002Fimage-slot><\u002Fdiv><div class=\"cs-b\">\n      <div class=\"cs-top\"><span class=\"cs-who\">Post-acute clinic network · CH<\u002Fspan><span class=\"badge m\">Measured<\u002Fspan><\u002Fdiv>\n      <h3 class=\"h3\">From a bundle of paper to a coded SwissDRG invoice<\u002Fh3>\n      <p class=\"body-s\">The assistant reads the admission file, drafts the discharge letter for the physician to sign, and prepares a validated invoice.<\u002Fp>\n      <div class=\"cs-nums\"><div><div class=\"v\">−92 %<\u002Fdiv><div class=\"k\">Admission time<\u002Fdiv><\u002Fdiv><div><div class=\"v\">−78 %<\u002Fdiv><div class=\"k\">Discharge letter<\u002Fdiv><\u002Fdiv><div><div class=\"v\">2 days<\u002Fdiv><div class=\"k\">Invoice ready, was 10–15<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Farticle>\n    <div class=\"cases-pair\"><article class=\"cs rv\"><div class=\"shot\"><image-slot id=\"case-practice\" shape=\"rect\" placeholder=\"Medical practice visual\"><\u002Fimage-slot><\u002Fdiv><div class=\"cs-b\">\n      <div class=\"cs-top\"><span class=\"cs-who\">Multi-disciplinary practice · CH<\u002Fspan><span class=\"badge m\">Measured<\u002Fspan><\u002Fdiv>\n      <h3 class=\"h3\">Voice consultation to TARDOC invoice<\u002Fh3>\n      <p class=\"body-s\">Physicians spent 35 % of their time documenting. Now the consultation becomes the report and the coded invoice.<\u002Fp>\n      <div class=\"cs-nums\"><div><div class=\"v\">+30.8 %<\u002Fdiv><div class=\"k\">Consultations, same salary<\u002Fdiv><\u002Fdiv><div><div class=\"v\">−84 %<\u002Fdiv><div class=\"k\">Time per invoice<\u002Fdiv><\u002Fdiv><div><div class=\"v\">3.5×<\u002Fdiv><div class=\"k\">Faster payment<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Farticle><article class=\"cs rv\"><div class=\"shot\"><image-slot id=\"case-water\" shape=\"rect\" placeholder=\"Water device / telemetry visual\"><\u002Fimage-slot><\u002Fdiv><div class=\"cs-b\">\n      <div class=\"cs-top\"><span class=\"cs-who\">Component manufacturer · IT<\u002Fspan><span class=\"badge m\">Measured<\u002Fspan><\u002Fdiv>\n      <h3 class=\"h3\">Up to 85 % of failures came from water, not defects<\u002Fh3>\n      <p class=\"body-s\">A device, telemetry and portals turned every warranty claim into a decision based on data.<\u002Fp>\n      <div class=\"cs-nums\"><div><div class=\"v\">−63 %<\u002Fdiv><div class=\"k\">Warranty cost<\u002Fdiv><\u002Fdiv><div><div class=\"v\">0.51 %<\u002Fdiv><div class=\"k\">Of revenue, was 1.37 %<\u002Fdiv><\u002Fdiv><div><div class=\"v\">+2<\u002Fdiv><div class=\"k\">New revenue lines<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Farticle><\u002Fdiv>\n    <div class=\"cs-more\">\n      <div class=\"cs-more-hd\"><span class=\"label-n\">More cases<\u002Fspan><\u002Fdiv>\n      <a class=\"cs-row rv\" href=\"#\"><span class=\"who\">Fiduciary · CH<\u002Fspan><span class=\"t\">Incoming mail and receipts without re-entry<\u002Fspan><span class=\"num\"><b>−89 %<\u002Fb> Receipt handling<\u002Fspan><span class=\"badge d\">Modelled<\u002Fspan><span class=\"ar\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <a class=\"cs-row rv\" href=\"#\"><span class=\"who\">Construction materials · scenario<\u002Fspan><span class=\"t\">Order desk to delivered load, without seasonal hiring<\u002Fspan><span class=\"num\"><b>65 %<\u002Fb> Reorders without a person<\u002Fspan><span class=\"badge d\">Modelled<\u002Fspan><span class=\"ar\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <a class=\"cs-row rv\" href=\"#\"><span class=\"who\">Letting agency, Romandie · scenario<\u002Fspan><span class=\"t\">Portal enquiry to booked viewing<\u002Fspan><span class=\"num\"><b>&lt;15 s<\u002Fb> First reply, was &gt;15 h<\u002Fspan><span class=\"badge d\">Modelled<\u002Fspan><span class=\"ar\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n    <div class=\"cs-all\"><a href=\"#\" class=\"btn btn-outline\">All case studies <span class=\"ar\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- STRONGEST -->\n<section class=\"sec\" data-screen-label=\"Industries\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Industries<\u002Fspan><h2 class=\"h2\">Where the case is strongest in Switzerland<\u002Fh2><p class=\"lede\">Ordered by how well the numbers work, not by how interesting the technology is.<\u002Fp><\u002Fdiv>\n  <ol class=\"rank\">\n    <li><span class=\"t\">Trade, wholesale, building materials<\u002Fspan><span class=\"body-s\">High volume, repeat questions, orders that must become deliveries, with a direct handoff into 8Move.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Real estate &amp; property management<\u002Fspan><span class=\"body-s\">Evening viewing requests; a broken boiler at 22:00 needs triage, not voicemail.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Clinics, dental, veterinary<\u002Fspan><span class=\"body-s\">Front desk booking and reminders, and voice documentation for doctors, where the real money is.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">E-commerce &amp; D2C<\u002Fspan><span class=\"body-s\">Order status, sizing, returns, cross-sell. The cleanest automation economics.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Hospitality &amp; restaurants<\u002Fspan><span class=\"body-s\">Reservations, groups, allergen questions in four languages during service.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Professional services &amp; trades<\u002Fspan><span class=\"body-s\">No reception; every missed call is a lost mandate.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Education &amp; training<\u002Fspan><span class=\"body-s\">Course enquiries and enrolment peaks without temporary staff.<\u002Fspan><\u002Fli>\n    <li><span class=\"t\">Startups — CTO as a Service<\u002Fspan><span class=\"body-s\">Days per month instead of a hire: build vs buy, architecture, data, first hires. Also due diligence before an investment.<\u002Fspan><\u002Fli>\n  <\u002Fol>\n<\u002Fdiv><\u002Fsection>\n\n<!-- VS -->\n<section class=\"sec alt\" data-screen-label=\"Agent vs hire\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">The decision<\u002Fspan><h2 class=\"h2\">An agent, or one more hire?<\u002Fh2><\u002Fdiv>\n  <div class=\"vs\">\n    <div class=\"vs-col us rv\"><div class=\"lbl\">AI agent<\u002Fdiv><h3 class=\"h3\">In your stack<\u002Fh3><dl>\n      <div><dt>First response<\u002Fdt><dd>Seconds<\u002Fdd><\u002Fdiv><div><dt>Running cost<\u002Fdt><dd>From CHF 450/mo<\u002Fdd><\u002Fdiv><div><dt>Ramp-up<\u002Fdt><dd>Days<\u002Fdd><\u002Fdiv><div><dt>Parallel conversations<\u002Fdt><dd>Unlimited<\u002Fdd><\u002Fdiv><div><dt>Languages<\u002Fdt><dd>4 regions<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Fdiv>\n    <div class=\"vs-col rv\"><div class=\"lbl\">Additional FTE<\u002Fdiv><h3 class=\"h3\">A CHF 8,000-a-month hire<\u002Fh3><dl>\n      <div><dt>First response<\u002Fdt><dd>15–30 min, next day after hours<\u002Fdd><\u002Fdiv><div><dt>Running cost<\u002Fdt><dd>CHF 90–120k/yr<\u002Fdd><\u002Fdiv><div><dt>Ramp-up<\u002Fdt><dd>3–6 months<\u002Fdd><\u002Fdiv><div><dt>Parallel conversations<\u002Fdt><dd>10–15<\u002Fdd><\u002Fdiv><div><dt>Languages<\u002Fdt><dd>1–2<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"small\" style=\"margin-top:20px\">The agent handles the routine 70–80 % of conversations. Complex deals stay with your people.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- PRICING -->\n<section class=\"sec\" id=\"pricing\" data-screen-label=\"Pricing\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Pricing<\u002Fspan><h2 class=\"h2\">Published, not hidden<\u002Fh2><p class=\"lede\">Integration is its own line, because that's where projects overrun.<\u002Fp><\u002Fdiv>\n  <div class=\"prices\">\n    <div class=\"price rv\"><div class=\"lbl\">Integration · one-off<\u002Fdiv><div class=\"amt\">CHF 6–25k<\u002Fdiv><ul><li>Discovery and scenario design<\u002Fli><li>Knowledge base build<\u002Fli><li>ERP / CRM integration<\u002Fli><li>Staff training, 2 weeks supervised live<\u002Fli><li>First month of tuning<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"price hi rv\"><div class=\"lbl\">Run · monthly<\u002Fdiv><div class=\"amt\">from CHF 450 <small>/ mo<\u002Fsmall><\u002Fdiv><ul><li>Typical: CHF 900 / mo<\u002Fli><li>Full automation: CHF 1,800 / mo<\u002Fli><li>Platform, hosting, monitoring, support<\u002Fli><li>Model usage at cost, no margin on tokens<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"price rv\"><div class=\"lbl\">Outcome share · optional<\u002Fdiv><div class=\"amt\">70 / 30<\u002Fdiv><ul><li>70 % fixed fee<\u002Fli><li>30 % tied to a KPI agreed in writing<\u002Fli><li>Leads, bookings, or response time<\u002Fli><li>Only where measurement is honest<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ways\">\n    <div><span class=\"label-n\">We price from your number<\u002Fspan><h3 class=\"h4\" style=\"margin-top:10px\">1. Direct labour<\u002Fh3><p class=\"body-s\" style=\"margin-top:8px\">Hours on repetitive enquiries × loaded cost. One inside-sales FTE spends 4–6 hours a day on them.<\u002Fp><\u002Fdiv>\n    <div><span class=\"label-n\">&nbsp;<\u002Fspan><h3 class=\"h4\" style=\"margin-top:10px\">2. Lost revenue<\u002Fh3><p class=\"body-s\" style=\"margin-top:8px\">After-hours enquiries × close rate × deal value. Usually the largest, and never measured.<\u002Fp><\u002Fdiv>\n    <div><span class=\"label-n\">&nbsp;<\u002Fspan><h3 class=\"h4\" style=\"margin-top:10px\">3. Cost of errors<\u002Fh3><p class=\"body-s\" style=\"margin-top:8px\">Wrong quotes, missed bookings, no-shows nobody confirmed, priced at lost margin.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- CALCULATOR -->\n<section class=\"sec alt\" id=\"calc\" data-screen-label=\"Calculator\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Calculator<\u002Fspan><h2 class=\"h2\">Does it pay back for you?<\u002Fh2><p class=\"lede\">The same model we use in the audit. It can say \"not yet\".<\u002Fp><\u002Fdiv>\n  <div class=\"calc\">\n    <div class=\"calc-in\">\n      <div><div class=\"f-row\"><label for=\"i-enq\">Enquiries per month<\u002Flabel><span class=\"v\" id=\"v-enq\">400<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"i-enq\" min=\"20\" max=\"3000\" step=\"20\" value=\"400\"><\u002Fdiv>\n      <div><div class=\"f-row\"><label for=\"i-ooh\">Outside office hours<\u002Flabel><span class=\"v\" id=\"v-ooh\">35 %<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"i-ooh\" min=\"0\" max=\"70\" step=\"1\" value=\"35\"><\u002Fdiv>\n      <div><div class=\"f-row\"><label for=\"i-deal\">Average deal value<\u002Flabel><span class=\"v\" id=\"v-deal\">CHF 1,400<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"i-deal\" min=\"100\" max=\"20000\" step=\"100\" value=\"1400\"><\u002Fdiv>\n      <div><div class=\"f-row\"><label for=\"i-close\">Close rate<\u002Flabel><span class=\"v\" id=\"v-close\">18 %<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"i-close\" min=\"1\" max=\"60\" step=\"1\" value=\"18\"><\u002Fdiv>\n      <div><div class=\"f-row\"><label>Scope<\u002Flabel><\u002Fdiv><div class=\"seg\" id=\"i-scope\">\n        <button type=\"button\" data-run=\"450\" data-int=\"6000\" aria-pressed=\"false\">One channel<\u002Fbutton>\n        <button type=\"button\" data-run=\"900\" data-int=\"12000\" aria-pressed=\"true\">Typical<\u002Fbutton>\n        <button type=\"button\" data-run=\"1800\" data-int=\"25000\" aria-pressed=\"false\">Full<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"calc-out\">\n      <span class=\"small\">Estimated net effect per month<\u002Fspan>\n      <div class=\"big\" id=\"o-net\">CHF 12,976<\u002Fdiv>\n      <dl class=\"calc-rows\">\n        <div><dt>Routine work absorbed (0.8 FTE)<\u002Fdt><dd id=\"o-fte\">CHF 6,400<\u002Fdd><\u002Fdiv>\n        <div><dt>After-hours enquiries won<\u002Fdt><dd id=\"o-ooh\">CHF 5,292<\u002Fdd><\u002Fdiv>\n        <div><dt>Faster response, in hours<\u002Fdt><dd id=\"o-fast\">CHF 2,184<\u002Fdd><\u002Fdiv>\n        <div><dt>Agent running cost<\u002Fdt><dd id=\"o-run\">−CHF 900<\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n      <div class=\"verdict ok\" id=\"o-v\"><b id=\"o-vh\">Pays back by month 2<\u002Fb><span id=\"o-vt\"><\u002Fspan><\u002Fdiv>\n      <p class=\"calc-note\">Based on CHF 8,000 loaded cost per person; after-hours enquiries convert at half the normal rate; 30 % margin on new revenue. Modelled, not measured.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- SAY NO -->\n<section class=\"sec\" data-screen-label=\"Where we say no\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Honest limits<\u002Fspan><h2 class=\"h2\">Where we say no<\u002Fh2><p class=\"lede\">The fastest way to find out whether there is a project here at all.<\u002Fp><\u002Fdiv>\n  <div class=\"nos\">\n    <div class=\"no rv\"><h3 class=\"h4\">Under ~150 enquiries a month<\u002Fh3><p class=\"body-s\">The numbers don't work. Fix the response process first; call us at volume.<\u002Fp><\u002Fdiv>\n    <div class=\"no rv\"><h3 class=\"h4\">No written knowledge base<\u002Fh3><p class=\"body-s\">The agent inherits your quality. Nothing to inherit means nothing to deploy.<\u002Fp><\u002Fdiv>\n    <div class=\"no rv\"><h3 class=\"h4\">Regulated advice<\u002Fh3><p class=\"body-s\">Diagnosis, investment, legal opinion. The agent books, triages and prepares; it does not advise.<\u002Fp><\u002Fdiv>\n    <div class=\"no rv\"><h3 class=\"h4\">Swiss German voice<\u002Fh3><p class=\"body-s\">Dialect text works well. Spoken dialect is every vendor's weak point, ours too. Start with text.<\u002Fp><\u002Fdiv>\n    <div class=\"no rv\"><h3 class=\"h4\">Pure headcount cuts<\u002Fh3><p class=\"body-s\">\"Take the routine off the team\" works. \"Replace the team\" underperforms. We say so at the first meeting.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- PROCESS -->\n<section class=\"sec alt\" data-screen-label=\"Process\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">How we work<\u002Fspan><h2 class=\"h2\">Live in three to five weeks<\u002Fh2><p class=\"lede\">The gating item is almost never the technology. It's how fast your side can answer questions about its own process.<\u002Fp><\u002Fdiv>\n  <div class=\"proc proc6\">\n    <div class=\"pstep rv\"><span class=\"n\">01<\u002Fspan><h3 class=\"h4\">Audit and scenarios<\u002Fh3><p class=\"body-s\">We read your last 200 enquiries: what repeats, what converts, where it breaks.<\u002Fp><span class=\"when\">Days 1–3<\u002Fspan><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">02<\u002Fspan><h3 class=\"h4\">Knowledge base<\u002Fh3><p class=\"body-s\">Catalogue, prices, terms, FAQ, approved wording. The stage that decides quality.<\u002Fp><span class=\"when\">Days 3–10<\u002Fspan><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">03<\u002Fspan><h3 class=\"h4\">Channels and systems<\u002Fh3><p class=\"body-s\">WhatsApp verification, widget, CRM, ERP, calendar, payment.<\u002Fp><span class=\"when\">Days 8–15<\u002Fspan><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">04<\u002Fspan><h3 class=\"h4\">Testing<\u002Fh3><p class=\"body-s\">Your team tries to break it, in four languages. Nothing goes live without sign-off.<\u002Fp><span class=\"when\">Days 15–20<\u002Fspan><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">05<\u002Fspan><h3 class=\"h4\">Supervised launch<\u002Fh3><p class=\"body-s\">Live traffic, every conversation reviewed daily.<\u002Fp><span class=\"when\">Days 20–25<\u002Fspan><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">06<\u002Fspan><h3 class=\"h4\">Operation and tuning<\u002Fh3><p class=\"body-s\">Monthly review. Same named engineer from audit to operation.<\u002Fp><span class=\"when\">Ongoing<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"small\" style=\"margin-top:24px\">First measurable effects after two to four weeks live. Anyone promising results in week one is quoting a demo.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<!-- INTEGRATIONS -->\n<section class=\"sec\" id=\"integrations\" data-screen-label=\"Integrations\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Integrations<\u002Fspan><h2 class=\"h2\">Works with what you already run<\u002Fh2><p class=\"lede\">Anything with an API, plus a documented fallback for systems that only export CSV at night.<\u002Fp><\u002Fdiv>\n  <div class=\"ints\">\n    <div><h3>Channels<\u002Fh3><div class=\"chips\"><span>WhatsApp Business<\u002Fspan><span>Website widget<\u002Fspan><span>E-mail<\u002Fspan><span>Telegram<\u002Fspan><span>Instagram / Facebook<\u002Fspan><span>SMS<\u002Fspan><span>Microsoft Teams<\u002Fspan><span>Voice<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div><h3>CRM<\u002Fh3><div class=\"chips\"><span>HubSpot<\u002Fspan><span>Salesforce<\u002Fspan><span>Pipedrive<\u002Fspan><span>MS Dynamics<\u002Fspan><span>Zoho<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div><h3>ERP &amp; accounting<\u002Fh3><div class=\"chips\"><span>bexio<\u002Fspan><span>Abacus<\u002Fspan><span>SAP Business One<\u002Fspan><span>Odoo<\u002Fspan><span>Sage<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div><h3>Payment<\u002Fh3><div class=\"chips\"><span>Swiss QR-bill<\u002Fspan><span>TWINT<\u002Fspan><span>Stripe<\u002Fspan><span>PostFinance<\u002Fspan><span>Datatrans<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div><h3>Healthcare<\u002Fh3><div class=\"chips\"><span>vitomed<\u002Fspan><span>amétiq siMed<\u002Fspan><span>KISIM<\u002Fspan><span>Epic<\u002Fspan><span>HL7 / FHIR<\u002Fspan><span>HIN mail<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div><h3>Calendar &amp; logistics<\u002Fh3><div class=\"chips\"><span>Outlook<\u002Fspan><span>Google Calendar<\u002Fspan><span>8Move Fleet Planner<\u002Fspan><span>Driver Pro<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- PRODUCTS -->\n<section class=\"sec alt\" id=\"products\" data-screen-label=\"Products\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Our products<\u002Fspan><h2 class=\"h2\">We build what we maintain ourselves<\u002Fh2><p class=\"lede\">A product company that consults, not an agency that sells hours.<\u002Fp><\u002Fdiv>\n  <div class=\"feats\">\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <span class=\"badge m\">In production<\u002Fspan>\n      <h3 class=\"h3\" style=\"margin-top:14px\">8Move: logistics platform<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">Order intake, dispatch, driver app with photo proof and signature, live tracking, automated invoicing. In use with Swiss and European operators.<\u002Fp>\n      <ul><li>Passenger transport edition<\u002Fli><li>Construction-material haulage edition<\u002Fli><li>Last-mile delivery edition<\u002Fli><\u002Ful>\n      <a href=\"#\" class=\"link\" style=\"margin-top:18px\">8move.com <span class=\"ar\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv><div class=\"shot\"><image-slot id=\"prod-8move\" shape=\"rect\" placeholder=\"8Move dispatch screen\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <span class=\"badge m\">Delivered<\u002Fspan>\n      <h3 class=\"h3\" style=\"margin-top:14px\">WaterTDS: connected water device<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">Firmware, cloud, rules engine, dealer portal and consumer app, from kick-off to first installations in 9 months.<\u002Fp>\n      <ul><li>Peak team of 6, steady state 3<\u002Fli><li>Maintenance by litres, not by calendar<\u002Fli><\u002Ful>\n      <a href=\"#\" class=\"link\" style=\"margin-top:18px\">watertds.com <span class=\"ar\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv><div class=\"shot\"><image-slot id=\"prod-tds\" shape=\"rect\" placeholder=\"WaterTDS device + app\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n    <div class=\"feat rv\"><div class=\"feat-t\">\n      <span class=\"badge m\">Delivered 2025<\u002Fspan>\n      <h3 class=\"h3\" style=\"margin-top:14px\">Document recognition and recommendation engine<\u002Fh3>\n      <p class=\"body\" style=\"margin-top:12px\">The two AI patterns that pay back fastest: reading documents nobody wants to read, and deciding what to offer next from live data.<\u002Fp>\n      <ul><li>Document pipeline delivered in <b>4 months<\u002Fb>, ~2,500 documents a month<\u002Fli><li>Recommendation engine delivered in <b>3 months<\u002Fb><\u002Fli><\u002Ful>\n    <\u002Fdiv><div class=\"shot\"><image-slot id=\"prod-ai\" shape=\"rect\" placeholder=\"Document recognition UI\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- SWISS -->\n<section class=\"sec\" id=\"swiss\" data-screen-label=\"Swiss\"><div class=\"wrap\">\n  <div class=\"swiss\">\n    <div>\n      <span class=\"label\">Swiss by jurisdiction<\u002Fspan>\n      <h2 class=\"h2\" style=\"margin-top:18px\">Swiss contracts, Swiss accountability, <span class=\"ch\">your data stays yours<\u002Fspan><\u002Fh2>\n      <p class=\"lede\">Contracts and data residency sit in Switzerland. Engineering is distributed, which is how our rates work against Swiss agency pricing without cutting seniority.<\u002Fp>\n      <div class=\"swiss-facts\">\n        <div><h3>Hosting in CH or EU<\u002Fh3><p class=\"body-s\">Your choice of region. Documented sub-processors in the contract.<\u002Fp><\u002Fdiv>\n        <div><h3>revFADP and GDPR<\u002Fh3><p class=\"body-s\">Processing agreement and privacy wording drafted for you.<\u002Fp><\u002Fdiv>\n        <div><h3>No training on your data<\u002Fh3><p class=\"body-s\">Contractually excluded, vendor terms attached as an annex.<\u002Fp><\u002Fdiv>\n        <div><h3>You own it<\u002Fh3><p class=\"body-s\">Data, knowledge base and scenarios exported on termination.<\u002Fp><\u002Fdiv>\n        <div><h3>Model-independent<\u002Fh3><p class=\"body-s\">The underlying model can be swapped. No single-vendor risk.<\u002Fp><\u002Fdiv>\n        <div><h3>Registered in Valais<\u002Fh3><p class=\"body-s\">Trident Software Sàrl · CHE-185.076.733 · HES-SO Valais-Wallis · Campus Biotech, Geneva<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"langs\">\n    <div class=\"lg-card rv\"><span class=\"code\">DE<\u002Fspan><p>«Ja, 8 Tonnen sind an Lager. Montag 7.30 Uhr?»<\u002Fp><small>Own approved wording, not a translation<\u002Fsmall><\u002Fdiv>\n    <div class=\"lg-card rv\"><span class=\"code\">FR<\u002Fspan><p>«Oui, 8 tonnes en stock. Lundi 7h30&nbsp;?»<\u002Fp><small>Romandie<\u002Fsmall><\u002Fdiv>\n    <div class=\"lg-card rv\"><span class=\"code\">IT<\u002Fspan><p>«Sì, 8 tonnellate disponibili. Lunedì alle 7.30?»<\u002Fp><small>Ticino<\u002Fsmall><\u002Fdiv>\n    <div class=\"lg-card rv\"><span class=\"code\">EN<\u002Fspan><p>“Yes, 8 tonnes in stock. Monday 7:30?”<\u002Fp><small>International clients<\u002Fsmall><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- WHY US -->\n<section class=\"sec alt\" data-screen-label=\"Why us\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Why us<\u002Fspan><h2 class=\"h2\">We've shipped the boring parts<\u002Fh2><p class=\"lede\">Anyone can demo a language model answering a question. Few have wired one into a dispatch system a driver depends on at six in the morning.<\u002Fp><\u002Fdiv>\n  <div class=\"proc proc6\">\n    <div class=\"pstep rv\"><span class=\"n\">01<\u002Fspan><h3 class=\"h4\">We say no<\u002Fh3><p class=\"body-s\">Our own material tells you when automation isn't worth it yet.<\u002Fp><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">02<\u002Fspan><h3 class=\"h4\">Measured vs modelled<\u002Fh3><p class=\"body-s\">Every figure we publish says which it is.<\u002Fp><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">03<\u002Fspan><h3 class=\"h4\">Senior at rates that work<\u002Fh3><p class=\"body-s\">Swiss accountability, distributed delivery, no juniors sold as seniors.<\u002Fp><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">04<\u002Fspan><h3 class=\"h4\">Product company<\u002Fh3><p class=\"body-s\">We build what we'd maintain for five years, because with 8Move we do.<\u002Fp><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">05<\u002Fspan><h3 class=\"h4\">A named engineer<\u002Fh3><p class=\"body-s\">Not a ticket queue. Same person from audit to operation.<\u002Fp><\u002Fdiv>\n    <div class=\"pstep rv\"><span class=\"n\">06<\u002Fspan><h3 class=\"h4\">No lock-in<\u002Fh3><p class=\"body-s\">Knowledge base, transcripts and scenarios are exported to you.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- TESTIMONIALS -->\n<section class=\"sec\" data-screen-label=\"Testimonials\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">Clients<\u002Fspan><h2 class=\"h2\">What clients say<\u002Fh2><\u002Fdiv>\n  <div class=\"quotes\">\n    <div class=\"quote rv\"><p>Trident Software helped us with the ERP implementation, as well as organization and automation of business processes. They offered alternatives taking into account time frames and budget.<\u002Fp><footer><b>Ivan Boboretsky<\u002Fb>DaniParts<\u002Ffooter><\u002Fdiv>\n    <div class=\"quote rv\"><p>Their approach is to deeply understand the subject area and scope of the project by working with our team. They are well versed in latest Agile tools to keep track of deadlines.<\u002Fp><footer><b>Naren Bansal<\u002Fb>Xelsat<\u002Ffooter><\u002Fdiv>\n    <div class=\"quote rv\"><p>Ils ont fait preuve d'une grande réactivité, résolvant notre problème en un temps record. Je recommande vivement Trident.<\u002Fp><footer><b>Adrien Thétaz<\u002Fb>Kleap.co<\u002Ffooter><\u002Fdiv>\n    <div class=\"quote rv\"><p>Excellente compagnie. Nous sommes très satisfaits du site internet que cette société a créé; les retours sont très positifs.<\u002Fp><footer><b>Guillaume Moulin<\u002Fb>Ardevaz SLS<\u002Ffooter><\u002Fdiv>\n    <div class=\"quote rv\"><p>This has greatly fostered development, unity and solidarity among our members.<\u002Fp><footer><b>David Ouedec<\u002Fb>GO-Valais Expat Club<\u002Ffooter><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- REFERENCES -->\n<section class=\"sec alt\" data-screen-label=\"References\"><div class=\"wrap\">\n  <div class=\"comp\">\n    <div><span class=\"label\">References<\u002Fspan><h2 class=\"h2\" style=\"margin-top:18px\">Available on request<\u002Fh2>\n      <div class=\"comp-list\" style=\"margin-top:26px\">\n        <div><span class=\"c\">CH<\u002Fspan><span class=\"d\">Interhome Group, vacation rental<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">ES<\u002Fspan><span class=\"d\">Ruralidays, travel platform, incl. Holidu integration<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">CH<\u002Fspan><span class=\"d\">Le Glaçon Suisse, ice production &amp; nationwide distribution<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">CH<\u002Fspan><span class=\"d\">Aida Medical, digital health (our CTO is co-founder)<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">UK<\u002Fspan><span class=\"d\">London waste-management operator (under NDA)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <div><span class=\"label\">Partners &amp; portfolio<\u002Fspan><h2 class=\"h2\" style=\"margin-top:18px\">What we're looking for<\u002Fh2>\n      <div class=\"comp-list\" style=\"margin-top:26px\">\n        <div><span class=\"c\">01<\u002Fspan><span class=\"d\">Portfolio companies that need an engineering team, to build a product or take one over<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">02<\u002Fspan><span class=\"d\">AI automation in logistics, field services, distribution, healthcare admin<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">03<\u002Fspan><span class=\"d\">Technical due diligence before an investment, interim CTO after it<\u002Fspan><\u002Fdiv>\n        <div><span class=\"c\">04<\u002Fspan><span class=\"d\">Co-development where our platform gives a head start<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"small\" style=\"margin-top:16px\">Not staff augmentation by the hour.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- FAQ -->\n<section class=\"sec\" id=\"faq\" data-screen-label=\"FAQ\"><div class=\"wrap\">\n  <div class=\"sec-head\"><span class=\"label\">FAQ<\u002Fspan><h2 class=\"h2\">Questions before the audit<\u002Fh2><\u002Fdiv>\n  <div class=\"faq\">\n    <details open=\"\"><summary><span class=\"q\">What happens in the 45-minute audit?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">We go through your enquiry volumes, response times, channels, languages and systems. You leave with your own numbers and a straight answer on whether automation pays back. Free, no obligation.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">When is the answer \"not yet\"?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">Under roughly 150 enquiries a month, the numbers don't clear the build cost. Without a documented knowledge base, there's nothing for the agent to answer from. That's a content project first.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">How is this different from a chatbot?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">A chatbot answers. An agent reads your live catalogue, books against a real calendar, issues a QR-bill, writes into your CRM, and hands over to a person on defined conditions.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">Where does our data live?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">Hosting in Switzerland or the EU, under revFADP and GDPR. You own your data, knowledge base and scenarios. That's written into the contract.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">Will it replace our sales team?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">No. It handles the routine 70–80 % of conversations. Complex deals stay with your people, and the handover point is designed in.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">What if the agent gets something wrong?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">It escalates on low confidence rather than improvising. The threshold is a setting, and we start it conservative. Prices, stock and availability are read live, never quoted from memory.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">Will customers know they're talking to a machine?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">Yes, disclosed up front. Concealment reads as dishonest and, under the EU AI Act, is heading towards unlawful. Disclosed agents that answer well outperform hidden ones.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">We already had a chatbot and it was a disaster.<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">Usually a decision-tree bot with no live data, no escalation and no owner after launch. Bring the transcripts to the audit; they show fastest what changes.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">How long until it's live?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">Three to five weeks from signature. First measurable effects after two to four weeks of live running.<\u002Fdiv><\u002Fdetails>\n    <details><summary><span class=\"q\">Can we start small?<\u002Fspan><span class=\"mk\">+<\u002Fspan><\u002Fsummary><div class=\"a\">That's the recommended path: one channel, one scenario, one month. The first month of tuning is included in the integration fee.<\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- BLOG -->\n<section class=\"sec alt\" id=\"blog\" data-screen-label=\"Blog\"><div class=\"wrap\">\n  <div class=\"sec-head-row\"><div class=\"t\"><span class=\"label\">Blog &amp; news<\u002Fspan><h2 class=\"h2\">From the team<\u002Fh2><\u002Fdiv><a href=\"#\" class=\"btn btn-outline\">All articles <span class=\"ar\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n  <div class=\"posts2\">\n    <a class=\"post2 rv\" href=\"#\"><div class=\"shot\"><image-slot id=\"v2-post-1\" shape=\"rect\" placeholder=\"Article image\"><\u002Fimage-slot><\u002Fdiv><span class=\"date\">21 Nov 2025<\u002Fspan><h3 class=\"h4\">Smart auto parts software that unifies e-commerce, warehouse, delivery and AI<\u002Fh3><\u002Fa>\n    <a class=\"post2 rv\" href=\"#\"><div class=\"shot\"><image-slot id=\"v2-post-2\" shape=\"rect\" placeholder=\"Article image\"><\u002Fimage-slot><\u002Fdiv><span class=\"date\">5 Nov 2025<\u002Fspan><h3 class=\"h4\">Automechanika Dubai 2025: meet us in Hall 8, Booth F18<\u002Fh3><\u002Fa>\n    <a class=\"post2 rv\" href
