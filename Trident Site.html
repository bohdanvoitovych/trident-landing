  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2fe991de-dbe7-4fe6-beae-096e201ecfe2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"aee3d3c5-8704-4d30-856d-c3d84ab36e5e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2fe991de-dbe7-4fe6-beae-096e201ecfe2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root{\n  --bg:#FFFFFF; --bg-alt:#F6F7F8; --bg-deep:#0F1216;\n  --text:#111318; --text-2:#4A4F57; --text-3:#6B7078;\n  --line:#E3E5E8; --line-2:#C9CDD2;\n  --blue:#2772E0; --blue-d:#1B57B8; --blue-l:#8FB6F4; --blue-wash:#EEF3FD;\n  --w:1240px;\n  --pad:clamp(20px,5vw,64px);\n  --gap:clamp(20px,2vw,32px);\n  --sans:'Instrument Sans',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;\n  --mono:'IBM Plex Mono',ui-monospace,monospace;\n  --ease:cubic-bezier(.2,0,0,1);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\nbody{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}\nimg{display:block;max-width:100%}\na{color:inherit;text-decoration:none}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--blue);outline-offset:3px}\n\n.wrap{max-width:var(--w);margin-inline:auto;padding-inline:var(--pad)}\n.hr{height:1px;background:var(--line);border:0}\n\n/* ---------- type ---------- */\nh1,h2,h3,h4{font-weight:600;letter-spacing:-.022em;line-height:1.14;text-wrap:balance}\n.display{font-size:clamp(38px,5.4vw,72px);font-weight:600;letter-spacing:-.032em;line-height:1.04}\n.h2{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.027em;line-height:1.08}\n.h3{font-size:clamp(19px,1.7vw,24px);letter-spacing:-.018em;line-height:1.26}\n.h4{font-size:19px;letter-spacing:-.014em;line-height:1.3}\n.lede{font-size:clamp(18px,1.45vw,21px);line-height:1.56;color:var(--text-2);max-width:60ch}\n.body{font-size:17px;line-height:1.65;color:var(--text-2);max-width:68ch}\n.body-s{font-size:15.5px;line-height:1.6;color:var(--text-2);max-width:66ch}\n.small{font-size:14px;line-height:1.55;color:var(--text-3)}\n.label{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--blue-d)}\n.label-n{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3)}\n.tnum{font-variant-numeric:tabular-nums}\nstrong,b{font-weight:600;color:var(--text)}\n\n/* ---------- sections ---------- */\nsection.sec{padding-block:clamp(64px,8vw,124px)}\nsection.alt{background:var(--bg-alt)}\nsection.line-top{border-top:1px solid var(--line)}\n.sec-head{max-width:66ch;margin-bottom:clamp(36px,4.4vw,64px)}\n.sec-head .label,.sec-head .label-n{display:block;margin-bottom:18px}\n.sec-head .lede{margin-top:18px}\n.sec-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px)}\n.sec-head-row .t{max-width:60ch}\n.sec-head-row .t .label,.sec-head-row .t .label-n{display:block;margin-bottom:16px}\n\n/* ---------- buttons ---------- */\n.btn{display:inline-flex;align-items:center;gap:9px;font-size:15.5px;font-weight:500;letter-spacing:-.005em;padding:14px 22px;border:1px solid transparent;border-radius:2px;cursor:pointer;transition:background .18s var(--ease),color .18s,border-color .18s}\n.btn .ar{transition:transform .18s var(--ease)}\n.btn:hover .ar{transform:translateX(3px)}\n.btn-primary{background:var(--blue);color:#fff}\n.btn-primary:hover{background:var(--blue-d)}\n.btn-outline{border-color:var(--line-2);color:var(--text)}\n.btn-outline:hover{border-color:var(--text);background:var(--bg-alt)}\n.btn-dark{background:var(--text);color:#fff}\n.btn-dark:hover{background:var(--blue)}\n.btn-light{background:#fff;color:var(--text)}\n.btn-light:hover{background:var(--blue-l);color:var(--text)}\n.btn-ghost-d{border-color:rgba(255,255,255,.3);color:#fff}\n.btn-ghost-d:hover{background:rgba(255,255,255,.1)}\n.btn-sm{padding:10px 16px;font-size:14.5px}\n.link{color:var(--blue-d);font-weight:500;display:inline-flex;align-items:center;gap:7px}\n.link:hover{color:var(--blue)}\n.link .ar{transition:transform .18s var(--ease)}\n.link:hover .ar{transform:translateX(3px)}\n\n/* ---------- nav ---------- */\n.topbar{border-bottom:1px solid var(--line);background:var(--bg-alt)}\n.topbar-in{display:flex;align-items:center;gap:clamp(12px,2.4vw,28px);min-height:38px;padding-block:9px;flex-wrap:wrap;font-size:13.5px;color:var(--text-3)}\n.topbar-in .dot{width:7px;height:7px;background:var(--blue);flex:0 0 auto}\n.topbar-in .lang{margin-left:auto;display:flex;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em}\n.topbar-in .lang a{color:var(--text-3)}\n.topbar-in .lang a:hover,.topbar-in .lang a[aria-current]{color:var(--text)}\n\nnav.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}\n.nav-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:clamp(14px,3vw,44px);height:72px}\n.nav-logo{grid-column:1}\n.nav-logo img{height:24px;width:auto}\n.nav-links{grid-column:2;display:flex;align-items:center;gap:clamp(12px,1.9vw,30px);justify-content:flex-end;min-width:0}\n.nav-in>.btn{grid-column:3;justify-self:end}\n.nav-toggle{grid-column:4;display:none}\n.nav-links a,.nav-trigger{font-size:15.5px;font-weight:500;color:var(--text-2);padding-block:4px;border-bottom:2px solid transparent;transition:color .16s,border-color .16s;white-space:nowrap;background:none;border-inline:0;border-top:0;cursor:pointer}\n.nav-links a:hover,.nav-trigger:hover{color:var(--text)}\n.nav-links a.on{color:var(--text);border-bottom-color:var(--blue)}\n.nav-toggle{display:none}\n@media(max-width:1000px){.nav-links{display:none}.nav-toggle{display:inline-flex}}\n\n/* ---------- hero ---------- */\n.hero{padding-block:clamp(56px,7.5vw,116px) clamp(48px,6vw,88px)}\n.hero .display{max-width:20ch}\n.hero .display em{font-style:normal;color:var(--blue)}\n.hero-lede{margin-top:clamp(22px,2.6vw,32px);font-size:clamp(18px,1.55vw,22px);line-height:1.55;color:var(--text-2);max-width:56ch}\n.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:clamp(28px,3.2vw,40px)}\n.hero-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;margin-top:clamp(44px,5.4vw,80px);border-top:1px solid var(--line)}\n.hero-facts>div{padding:22px clamp(18px,2.2vw,30px);border-right:1px solid var(--line)}\n.hero-facts>div:first-child{padding-left:0}\n.hero-facts>div:last-child{border-right:0}\n.hero-facts .v{font-size:clamp(22px,2vw,28px);font-weight:600;letter-spacing:-.022em;line-height:1.2}\n.hero-facts .k{font-size:14.5px;line-height:1.5;color:var(--text-3);margin-top:7px}\n@media(max-width:700px){.hero-facts>div{border-right:0;border-bottom:1px solid var(--line);padding-inline:0}.hero-facts>div:last-child{border-bottom:0}}\n\n/* ---------- logo strip ---------- */\n.logos{border-block:1px solid var(--line);padding-block:clamp(26px,3.2vw,44px);overflow:hidden;position:relative}\n.logos-lead{font-size:14px;color:var(--text-3);margin-bottom:22px}\n.logos-track{display:flex;gap:clamp(36px,5vw,76px);width:max-content;align-items:center;animation:marq 60s linear infinite}\n.logos:hover .logos-track{animation-play-state:paused}\n.logos-track img{height:clamp(20px,2.2vw,28px);width:auto;object-fit:contain;filter:grayscale(1) brightness(.4);opacity:.55;transition:opacity .22s,filter .22s}\n.logos-track img:hover{opacity:1;filter:none}\n.logos-fade{position:absolute;top:0;bottom:0;width:8vw;pointer-events:none;z-index:2}\n.logos-fade.l{left:0;background:linear-gradient(90deg,var(--bg),transparent)}\n.logos-fade.r{right:0;background:linear-gradient(270deg,var(--bg),transparent)}\n\n/* ---------- services ---------- */\n.svc-list{border-top:1px solid var(--line-2)}\n.svc{display:grid;grid-template-columns:minmax(0,19rem) minmax(0,1fr) auto;gap:clamp(20px,3vw,52px);padding-block:clamp(24px,2.8vw,36px);border-bottom:1px solid var(--line);align-items:start;transition:background .2s}\n.svc:hover{background:var(--bg-alt)}\nsection.alt .svc:hover{background:#fff}\n.svc-t{display:flex;flex-direction:column;gap:10px}\n.svc-t .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-3)}\n.svc .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}\n.svc .tags span{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--text-3);border:1px solid var(--line);padding:3px 9px;background:var(--bg)}\nsection.alt .svc .tags span{background:#fff}\n.svc .go{align-self:center;color:var(--blue);font-size:19px}\n@media(max-width:860px){.svc{grid-template-columns:1fr auto}.svc-t{grid-column:1/-1}}\n\n/* ---------- work / cases ---------- */\n.work{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}\n.case{background:var(--bg);border:1px solid var(--line);padding:clamp(24px,2.8vw,40px);display:flex;flex-direction:column;gap:18px;transition:border-color .2s,box-shadow .25s}\nsection.alt .case{background:#fff}\n.case:hover{border-color:var(--line-2);box-shadow:0 2px 18px rgba(17,19,24,.06)}\n.case-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}\n.case-who{font-size:14.5px;color:var(--text-3)}\n.case-who b{display:block;font-size:16px;color:var(--text);margin-bottom:2px}\n.case-tag{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line);padding:3px 9px}\n.case-tag.est{color:var(--blue-d);border-color:var(--blue-l);background:var(--blue-wash)}\n.metrics{margin-top:auto;border-top:1px solid var(--line)}\n.metric{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding-block:13px;border-bottom:1px solid var(--line)}\n.metric:last-child{border-bottom:0}\n.metric .k{font-size:15px;color:var(--text-2);max-width:26ch}\n.metric .v{font-size:clamp(18px,1.6vw,22px);font-weight:600;letter-spacing:-.022em;white-space:nowrap;font-variant-numeric:tabular-nums}\n.metric .v.up{color:var(--blue)}\n@media(max-width:900px){.work{grid-template-columns:1fr}}\n\n/* ---------- process ---------- */\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0;border-top:1px solid var(--line-2)}\n.step{padding:clamp(22px,2.6vw,34px) clamp(20px,2.4vw,32px) clamp(26px,3vw,40px);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}\n.steps>.step:first-child{padding-left:0}\n.step:last-child{border-right:0}\n.step .n{font-family:var(--mono);font-size:12px;letter-spacing:.11em;color:var(--blue-d);margin-bottom:clamp(20px,2.8vw,40px)}\n.step .when{font-size:14px;color:var(--text-3);margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}\n@media(max-width:860px){.step{border-right:0;padding-inline:0}}\n\n/* ---------- products ---------- */\n.prods{display:grid;gap:var(--gap)}\n.prod{border:1px solid var e:15px}\n.nav-panel .foot a{color:var(--blue-d);font-weight:500}\n\n<\u002Fstyle>\n<style>/* Extends trident-site.css — product-site sections with room for visuals */\n.shot{position:relative;background:var(--bg-alt);border:1px solid var(--line);overflow:hidden}\n.shot image-slot{position:absolute;inset:0;width:100%;height:100%}\n\n/* hero */\n.hero2{padding-block:clamp(48px,6.5vw,104px) clamp(40px,5vw,72px)}\n.hero2-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(32px,4.5vw,72px);align-items:center}\n.hero2 .display{font-size:clamp(36px,4.6vw,64px);max-width:15ch}\n.hero2 .display em{font-style:normal;color:var(--blue)}\n.hero2-visual{aspect-ratio:4/3;border-radius:6px;box-shadow:0 24px 60px -24px rgba(17,19,24,.28)}\n@media(max-width:960px){.hero2-grid{grid-template-columns:1fr}.hero2 .display{max-width:20ch}}\n\n/* stat cards */\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:var(--gap)}\n.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:clamp(22px,2.4vw,30px);display:flex;flex-direction:column;gap:12px}\nsection.alt .stat{background:#fff}\n.stat .v{font-size:clamp(36px,3.8vw,52px);font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--blue)}\n.stat .v.neg{color:var(--text)}\n.stat .k{font-size:15.5px;line-height:1.5;color:var(--text-2)}\n.stat .src{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3)}\n\n/* service cards */\n.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}\n.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .25s}\nsection.alt .card{background:#fff}\n.card:hover{border-color:var(--line-2);box-shadow:0 12px 32px -16px rgba(17,19,24,.18)}\n.card .shot{aspect-ratio:16/10;border:0;border-bottom:1px solid var(--line);border-radius:0}\n.card-b{padding:clamp(20px,2.2vw,28px);display:flex;flex-direction:column;gap:10px;flex:1}\n.card-b .link{margin-top:auto;padding-top:8px}\n.cards .card.wide{grid-column:span 2}\n.cards .card.wide .shot{aspect-ratio:16/7}\n@media(max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cards .card.wide{grid-column:span 2}}\n@media(max-width:620px){.cards{grid-template-columns:1fr}.cards .card.wide{grid-column:auto}.cards .card.wide .shot{aspect-ratio:16/10}}\n\n/* alternating feature rows */\n.feats{display:flex;flex-direction:column;gap:clamp(56px,7vw,112px)}\n.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(32px,5vw,88px);align-items:center}\n.feat:nth-child(even) .feat-t{order:2}\n.feat .shot{aspect-ratio:5/4;border-radius:6px}\n.feat ul{list-style:none;margin-top:22px;border-top:1px solid var(--line)}\n.feat li{padding:13px 0 13px 28px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5;color:var(--text-2);position:relative}\n.feat li::before{content:\"\";position:absolute;left:2px;top:21px;width:12px;height:2px;background:var(--blue)}\n.feat li b{color:var(--text)}\n@media(max-width:900px){.feat{grid-template-columns:1fr}.feat:nth-child(even) .feat-t{order:0}}\n\n/* case cards */\n.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}\n.cs{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}\n.cs .shot{aspect-ratio:16/9;border:0;border-bottom:1px solid var(--line);border-radius:0}\n.cs-b{padding:clamp(22px,2.4vw,32px);display:flex;flex-direction:column;gap:12px;flex:1}\n.cs-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n.cs-who{font-size:14px;color:var(--text-3)}\n.badge{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap}\n.badge.m{background:var(--blue-wash);color:var(--blue-d)}\n.badge.d{background:#FBF3E4;color:#8A5A0E}\n.cs-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}\n.cs-nums .v{font-size:clamp(22px,2.2vw,30px);font-weight:600;letter-spacing:-.03em;line-height:1.05;color:var(--blue)}\n.cs-nums .k{font-size:13.5px;line-height:1.4;color:var(--text-3);margin-top:6px}\n@media(max-width:900px){.cases{grid-template-columns:1fr}}\n@media(max-width:480px){.cs-nums{grid-template-columns:1fr 1fr}}\n\n/* agent vs hire */\n.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}\n.vs-col{border:1px solid var(--line);border-radius:6px;padding:clamp(24px,2.6vw,36px);background:#fff}\n.vs-col.us{background:var(--bg-deep);border-color:var(--bg-deep);color:#fff}\n.vs-col.us .h3{color:#fff}\n.vs-col .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}\n.vs-col.us .lbl{color:var(--blue-l)}\n.vs-col dl{margin-top:22px;border-top:1px solid var(--line)}\n.vs-col.us dl{border-top-color:rgba(255,255,255,.18)}\n.vs-col dl div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px}\n.vs-col.us dl div{border-bottom-color:rgba(255,255,255,.12)}\n.vs-col dt{color:var(--text-3)}\n.vs-col.us dt{color:rgba(255,255,255,.66)}\n.vs-col dd{font-weight:600;text-align:right}\n@media(max-width:820px){.vs{grid-template-columns:1fr}}\n\n/* pricing */\n.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}\n.price{background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(24px,2.6vw,34px);display:flex;flex-direction:column;gap:14px}\n.price.hi{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}\n.price .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-d)}\n.price .amt{font-size:clamp(26px,2.6vw,36px);font-weight:600;letter-spacing:-.03em;line-height:1.1}\n.price .amt small{font-size:15px;font-weight:500;color:var(--text-3);letter-spacing:0}\n.price ul{list-style:none;margin-top:6px;border-top:1px solid var(--line)}\n.price li{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--text-2)}\n@media(max-width:900px){.prices{grid-template-columns:1fr}}\n\n/* calculator */\n.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(24px,3vw,44px)}\n.calc-in{display:flex;flex-direction:column;gap:24px}\n.f-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:11px}\n.f-row label{font-size:15px;color:var(--text-2)}\n.f-row .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}\n.calc input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line-2);outline:0;display:block}\n.calc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--blue);cursor:grab;border:3px solid #fff;box-shadow:0 0 0 1px var(--blue)}\n.calc input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:grab;border:3px solid #fff}\n.seg{display:flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}\n.seg button{flex:1;padding:11px 8px;background:#fff;border:0;border-right:1px solid var(--line-2);font-size:14.5px;color:var(--text-2);cursor:pointer}\n.seg button:last-child{border-right:0}\n.seg button[aria-pressed=true]{background:var(--text);color:#fff}\n.calc-out{background:var(--bg-alt);border-radius:6px;padding:clamp(22px,2.6vw,34px);display:flex;flex-direction:column}\n.calc-out .big{font-size:clamp(40px,4.6vw,64px);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}\n.calc-out .big.neg{color:var(--text-3)}\n.calc-rows{margin-top:22px;border-top:1px solid var(--line-2)}\n.calc-rows div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}\n.calc-rows dt{color:var(--text-2)}\n.calc-rows dd{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}\n.verdict{margin-top:20px;padding:16px 18px;border-radius:4px;font-size:15px;line-height:1.55}\n.verdict.ok{background:var(--blue-wash);color:var(--text)}\n.verdict.no{background:#FBF3E4;color:var(--text)}\n.verdict b{display:block;margin-bottom:4px}\n.calc-note{margin-top:14px;font-size:13.5px;color:var(--text-3);line-height:1.5}\n@media(max-width:900px){.calc{grid-template-columns:1fr}}\n\n/* process */\n.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}\n.pstep{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:2px solid var(--line-2)}\n.pstep:first-child{border-top-color:var(--blue)}\n.pstep .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--blue-d)}\n.pstep .when{font-size:13.5px;color:var(--text-3);margin-top:auto}\n@media(max-width:900px){.proc{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:520px){.proc{grid-template-columns:1fr}}\n\n/* compliance chips */\n.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}\n.chips span{font-size:14.5px;padding:8px 14px;border:1px solid var(--line-2);border-radius:99px;background:#fff}\n\n/* faq */\n.faq{border-top:1px solid var(--line-2);max-width:860px}\n.faq details{border-bottom:1px solid var(--line)}\n.faq summary{padding:20px 0;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:baseline;list-style:none}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary .q{font-size:clamp(17px,1.4vw,19px);font-weight:600;letter-spacing:-.014em;line-height:1.35}\n.faq summary:hover .q{color:var(--blue)}\n.faq summary .mk{font-size:22px;color:var(--text-3);line-height:1;transition:transform .2s var(--ease)}\n.faq details[open] .mk{transform:rotate(45deg);color:var(--blue)}\n.faq .a{padding:0 40px 22px 0;font-size:16.5px;line-height:1.62;color:var(--text-2);max-width:70ch}\n\n/* use cases */\n.ucs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}\n.uc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(20px,2.2vw,26px);display:flex;flex-direction:column;gap:10px}\n.uc .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--blue-d)}\n.uc .pre{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--text-3)}\n.uc .pre b{color:var(--text-2)}\n@media(max-width:1060px){.ucs{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:560px){.ucs{grid-template-columns:1fr}}\n/* say no */\n.nos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--gap)}\n.no{border-left:2px solid #C98A1E;padding:4px 0 4px 20px;display:flex;flex-direction:column;gap:8px}\n/* integrations */\n.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(24px,3vw,40px) var(--gap)}\n.ints h3{font-size:16px;margin-bottom:12px}\n.ints .chips{margin-top:0}\n/* ranked industries */\n.rank{list-style:none;counter-reset:r;border-top:1px solid var(--line-2)}\n.rank li{counter-increment:r;display:grid;grid-template-columns:3rem minmax(0,16rem) minmax(0,1fr);gap:clamp(14px,2vw,32px);padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}\n.rank li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--blue-d);letter-spacing:.1em}\n.rank .t{font-weight:600;font-size:17px;letter-spacing:-.014em}\n@media(max-width:760px){.rank li{grid-template-columns:2.4rem minmax(0,1fr)}.rank li .body-s{grid-column:2}}\n/* three ways */\n.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:clamp(28px,3.4vw,44px);padding-top:clamp(24px,3vw,36px);border-top:1px solid var(--line)}\n@media(max-width:820px){.ways{grid-template-columns:1fr}}\n.proc6{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:clamp(28px,3vw,40px)}\n@media(max-width:900px){.proc6{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:520px){.proc6{grid-template-columns:1fr}}\n<\u002Fstyle>\n<style>/* Swiss accent layer — loads after trident-site-v2.css */\n:root{--ch:var(--blue);--ch-d:var(--blue-d)}\n\n/* swiss cross mark */\n.chx{display:inline-block;width:18px;height:18px;background:var(--ch);position:relative;flex:0 0 auto;vertical-align:-3px}\n.chx::before,.chx::after{content:\"\";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}\n.chx::before{width:62%;height:20%}\n.chx::after{width:20%;height:62%}\n.chx.lg{width:clamp(120px,15vw,200px);height:clamp(120px,15vw,200px)}\n\n/* top bar */\n.topbar-in .chx{width:13px;height:13px;vertical-align:-2px}\n.topbar-in b{color:var(--text);font-weight:600}\n\n/* hero */\n.hero-ch{position:relative;padding-block:clamp(56px,7.5vw,120px) clamp(40px,4.6vw,64px);overflow:hidden;border-bottom:1px solid var(--line)}\n.hero-ch::before{content:\"\";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc((min(100vw,var(--w)) - 2*var(--pad))/12) 100%;background-position:max(var(--pad),calc((100vw - var(--w))/2 + var(--pad))) 0;opacity:.55;mask-image:linear-gradient(180deg,#000 40%,transparent)}\n.hero-ch .wrap{position:relative}\n.hero-tag{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;color:var(--text-2);padding:8px 14px;border:1px solid var(--line-2);background:#fff;border-radius:99px}\n.hero-ch h1{font-size:clamp(40px,6.4vw,92px);font-weight:600;letter-spacing:-.04em;line-height:.98;margin-top:clamp(22px,2.6vw,32px);max-width:16ch}\n.hero-ch h1 .ch{color:var(--ch)}\n.h
