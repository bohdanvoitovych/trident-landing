services:
  app:
    image: ${APP_IMAGE:-trident-website:latest}
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trident}
    volumes:
      - trident_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-trident}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trident_pgdata:
